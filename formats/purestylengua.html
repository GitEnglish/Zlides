<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asset Catalog</title>
    <style>
        :root {
            /* Core Palette */
            --bg:            #0f1112;
            --surface:       #16181a;
            --text:          #e5e7eb;
            --text-body:     #cfd3d8;
            --muted:         #9ca3af;
            --faint:         #6b7280;

            /* Brand & Semantic */
            --brand:         #ff6b35;
            --brand-deep:    #7e1500;
            --brand-soft:    rgba(255, 107, 53, 0.12);
            --amber:         #f0b23e;
            --teal:          #4fb3a9;

            /* Typography Families */
            --font-display:  'Fraunces', Georgia, serif;
            --font-head:     'Raleway', sans-serif;
            --font-body:     'Inter', sans-serif;
            --font-ui:       system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        /* Section Color Themes */
        #vocabulary          { --accent: #447F9F; }
        #phrasal-verbs       { --accent: #3B8484; }
        #collocations        { --accent: #DE6E55; }
        #grammar             { --accent: #B06D29; }
        #idioms-and-phrases  { --accent: #62193D; }
        #focus-points        { --accent: #DCE62C; }
        #in-class-practice   { --accent: #b98cf0; }
        #self-study          { --accent: #6fc3df; }
        #tutor-todos         { --accent: #9ca3af; }

        /* Base Typography */
        body {
            font-family: var(--font-body);
            background-color: var(--bg);
            color: var(--text);
            font-size: 15.5px;
            line-height: 1.6;
            margin: 0;
            padding: 2rem;
        }

        /* Heading Hierarchy */
        h1 {
            font-family: var(--font-display);
            font-weight: 560;
            font-size: clamp(32px, 4.2vw, 48px);
            line-height: 1.06;
            letter-spacing: -0.015em;
            color: #ffffff;
            margin: 0 0 1rem;
        }

        h2 {
            font-family: var(--font-head);
            font-weight: 800;
            font-size: 21px;
            letter-spacing: 0.01em;
            line-height: 1.2;
            color: #ffffff;
            margin: 0 0 0.75rem;
        }

        h3 {
            font-family: var(--font-head);
            font-weight: 700;
            font-size: 19px;
            line-height: 1.25;
            letter-spacing: 0.005em;
            color: #ffffff;
            margin: 0 0 0.5rem;
        }

        /* Body & Meta Text */
        p, .def, .card-text-only {
            font-size: 14px;
            color: var(--text-body);
            line-height: 1.62;
            letter-spacing: 0.002em;
        }

        .card-text-only {
            color: var(--text);
        }

        .ex {
            font-size: 13.5px;
            color: var(--muted);
            font-style: italic;
            line-height: 1.5;
            letter-spacing: 0.004em;
        }

        .sub-header {
            color: var(--text);
            font-family: var(--font-head);
            font-size: 15px;
            letter-spacing: 0.03em;
            font-weight: 700;
        }

        /* UI Typography & Badges */
        .eyebrow, .summary-label, .count-label, .date-chip, .kv-tag, .pos-tag, .chip, .rank-badge, .chip-outline {
            font-family: var(--font-ui);
            font-variant-numeric: tabular-nums;
        }

        .eyebrow {
            font-weight: 700;
            font-size: 12px;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--brand);
        }

        .summary-label {
            font-weight: 600;
            font-size: 13px;
            letter-spacing: 0.03em;
            color: var(--brand);
        }

        .count-label, .date-chip {
            font-weight: 600;
            font-size: 13px;
            letter-spacing: 0.02em;
            color: var(--muted);
        }

        .kv-tag {
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 0.01em;
            line-height: 1.5;
            color: var(--brand);
        }
        .kv.alt .kv-tag { color: var(--teal); }
        .kv.mistake .kv-tag, .kv.trap .kv-tag { color: var(--amber); }

        .pos-tag, .chip {
            display: inline-block;
            font-size: 12.5px;
            font-weight: 600;
            letter-spacing: 0.02em;
            color: var(--accent);
            background-color: color-mix(in srgb, var(--accent) 12%, transparent);
            padding: 2px 8px;
            border-radius: 4px;
        }

        .rank-badge, .chip-outline {
            display: inline-block;
            font-size: 12.5px;
            font-weight: 500;
            letter-spacing: 0.01em;
            color: var(--muted);
            padding: 2px 8px;
            border: 1px solid var(--faint);
            border-radius: 4px;
        }

        /* Section Specific Overrides */
        #focus-points .def {
            font-size: 16px;
            line-height: 1.7;
            color: var(--text);
        }

        /* Layout Structure */
        main {
            max-width: 800px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 2rem;
        }

        section {
            background-color: var(--surface);
            padding: 1.5rem;
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <main>
        <header>
            <span class="eyebrow"><!-- Eyebrow / Category --></span>
            <h1><!-- Document Title --></h1>
            <span class="date-chip"><!-- Meta / Timestamp --></span>
        </header>

        <section id="vocabulary">
            <h2><!-- Section Header --></h2>
            <article class="card">
                <header>
                    <span class="pos-tag"><!-- Tag --></span>
                    <span class="rank-badge"><!-- Badge --></span>
                    <h3><!-- Entry Name --></h3>
                </header>
                <p class="def"><!-- Definition / Primary content --></p>
                <p class="ex"><!-- Context / Example string --></p>
            </article>
        </section>
    </main>
</body>
</html>
